# Build release `grok` binaries for main.
#
# Targets:
#   - macOS Intel      (x86_64-apple-darwin)      → grok-macos-x86_64
#   - macOS Apple Silicon (aarch64-apple-darwin)  → grok-macos-aarch64
#   - Linux x86_64     (x86_64-unknown-linux-gnu) → grok-linux-x86_64
#   - Linux ARM64      (aarch64-unknown-linux-gnu) → grok-linux-aarch64
#
# Manual dispatch (Actions → Build binaries → Run workflow) creates a GitHub
# Release tagged with a UTC timestamp to the second (e.g. v20260727-012230)
# and attaches all platform binaries + SHA256SUMS as downloadable assets.

name: Build binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-binaries-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C strip=symbols"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Compute version / release flag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="v$(date -u +'%Y%m%d-%H%M%S')"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Release version: ${version}"
          else
            echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "CI build only (no GitHub Release)"
          fi

  build:
    name: ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: grok-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: grok-macos-aarch64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: grok-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: grok-linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Matches rust-toolchain.toml; host target is auto-added.
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - name: Install DotSlash (for bin/protoc)
        run: |
          cargo install --locked --version 0.5.7 dotslash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          /usr/bin/env dotslash --help >/dev/null

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-${{ matrix.target }}
          cache-targets: true
          cache-all-crates: true

      - name: Verify protoc via DotSlash
        run: |
          ./bin/protoc --version
          echo "PROTOC=$(pwd)/bin/protoc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: |
          cargo build -p xai-grok-pager-bin --release --target "${{ matrix.target }}"

      - name: Package artifact
        run: |
          src="target/${{ matrix.target }}/release/xai-grok-pager"
          test -x "$src"
          out="dist/${{ matrix.artifact }}"
          mkdir -p dist
          cp "$src" "$out"
          chmod +x "$out"
          if command -v strip >/dev/null 2>&1; then
            strip "$out" || true
          fi
          ls -lh "$out"
          file "$out" || true
          "./$out" --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  # Push/CI: one downloadable zip with all four binaries (workflow artifacts).
  bundle:
    name: Bundle all platforms
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: grok-*
          merge-multiple: false

      - name: Assemble bundle
        run: |
          mkdir -p bundle
          find artifacts -type f -name 'grok-*' -exec cp {} bundle/ \;
          ls -lh bundle
          (
            cd bundle
            sha256sum grok-* | tee SHA256SUMS
          )

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: grok-binaries-${{ needs.prepare.outputs.version }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30

  # Manual dispatch only: create a timestamped GitHub Release with downloadable assets.
  release:
    name: Create GitHub Release
    needs: [prepare, build, bundle]
    runs-on: ubuntu-24.04
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: grok-binaries-${{ needs.prepare.outputs.version }}
          path: release-assets

      - name: Create release ${{ needs.prepare.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh release-assets
          short_sha="${GITHUB_SHA:0:7}"
          notes="Manual release built from \`${short_sha}\` on \`main\`.

          Version tag is a UTC timestamp to the second: \`${VERSION}\`.

          ### Assets
          - \`grok-macos-x86_64\` — macOS Intel
          - \`grok-macos-aarch64\` — macOS Apple Silicon
          - \`grok-linux-x86_64\` — Linux x86_64
          - \`grok-linux-aarch64\` — Linux ARM64
          - \`SHA256SUMS\` — checksums"
          gh release create "${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "grok ${VERSION}" \
            --notes "${notes}" \
            --target "${GITHUB_SHA}" \
            release-assets/*